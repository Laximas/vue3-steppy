name: Bug report
description: Something in Steppy isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/Laximas/vue3-steppy/issues) first.
        **Security vulnerabilities should not be reported here.** See the [Security Policy](https://github.com/Laximas/vue3-steppy/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A link to a minimal reproduction (StackBlitz, CodeSandbox, a repo) or the steps and code needed to see the problem.
      placeholder: |
        1. Render `<Steppy>` with these props: ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots or console output to help explain the problem.
  - type: input
    id: steppy-version
    attributes:
      label: vue3-steppy version
      placeholder: e.g. 1.7.0
    validations:
      required: true
  - type: input
    id: vue-version
    attributes:
      label: Vue version
      placeholder: e.g. 3.5.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 130 on macOS 15
  - type: dropdown
    id: accessibility
    attributes:
      label: Is this an accessibility issue?
      description: For example, a problem with keyboard navigation, screen readers, focus or color contrast.
      options:
        - "No"
        - "Yes"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (build tool, SSR, related issues, ...).
