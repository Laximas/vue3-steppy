name: Feature request
description: Suggest an idea or improvement for Steppy
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please search [existing issues](https://github.com/Laximas/vue3-steppy/issues) first to see if it has already been proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why doesn't Steppy cover it today?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Example props, slots or events are very helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this feature
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups or links to similar components.
